<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معرض أعمال المونتاج</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#ffffff;--card:#f4f6fb;--text:#0a0a0a;--muted:#5b6070;--accent:#1d4ed8;--line:#e2e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--card:#0c0f18;--text:#ffffff;--muted:#9aa3b8;--accent:#2f64e8;--line:#1a2033;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--card:#0c0f18;--text:#ffffff;--muted:#9aa3b8;--accent:#2f64e8;--line:#1a2033;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
nav b{font-size:20px;font-weight:800}
nav a{color:var(--muted);text-decoration:none;margin-inline-start:18px;font-size:15px}
nav a:hover{color:var(--accent)}
.hero{padding:70px 0 60px}
.hero small{color:var(--accent);font-weight:700;letter-spacing:.5px}
.hero h1{font-size:clamp(36px,7vw,64px);line-height:1.2;font-weight:800;margin:10px 0 16px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:18px;max-width:560px}
.btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;padding:12px 26px;border-radius:99px;text-decoration:none;font-weight:700}
section{padding:50px 0;border-top:1px solid var(--line)}
h2{font-size:28px;font-weight:800;margin-bottom:24px}
.about{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:center}
.avatar{width:200px;height:200px;border-radius:24px;background:linear-gradient(135deg,var(--accent),#05070f);display:grid;place-items:center;font-size:72px;color:#fff;font-weight:800}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat;background-size:auto 100vh;background-position:left top;opacity:calc(var(--o,.14)*var(--f,1));filter:blur(2px);-webkit-mask-image:radial-gradient(ellipse at 30% 35%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 30% 35%,#000 20%,transparent 75%)}
@media (prefers-color-scheme:dark){.bg{--o:.26}}
@media (max-width:640px){.bg{background-size:cover;background-position:center top}}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.about p{color:var(--muted);font-size:17px}
.stats{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.stats div b{display:block;font-size:30px;color:var(--accent)}
.stats div{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.work{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s}
.work:hover{transform:translateY(-5px)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;position:relative}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}.play{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#111;font-size:20px;padding-inline-start:4px}
.work div.info{padding:14px 16px}
.work h3{font-size:17px;font-weight:700}
.work span{color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tags span{background:var(--card);border:1px solid var(--line);padding:8px 18px;border-radius:99px;font-weight:500}
.contact a{display:inline-block;margin:0 0 10px 10px;background:var(--card);border:1px solid var(--line);padding:10px 22px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:500}
.contact a:hover{border-color:var(--accent);color:var(--accent)}
footer{text-align:center;color:var(--muted);padding:30px 0;font-size:14px;border-top:1px solid var(--line)}
@media(max-width:640px){.about{grid-template-columns:1fr}.avatar{width:120px;height:120px;font-size:44px}nav a{margin-inline-start:12px}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="wrap">
<nav><b id="logo"></b><div><a href="#about">نبذة</a><a href="#works">أعمالي</a><a href="#contact">تواصل</a></div></nav>

<header class="hero">
<small>محرّر فيديو وموشن جرافيك</small>
<h1>أحوّل اللقطات إلى <span>قصص</span> تُشاهَد للنهاية</h1>
<p id="tagline"></p>
<a class="btn" href="#works">شاهد أعمالي</a>
</header>

<section id="about">
<h2>نبذة عني</h2>
<div class="about">
<div class="avatar" id="avatar"></div>
<div>
<p id="bio"></p>
<div class="stats" id="stats"></div>
</div>
</div>
</section>

<section id="works">
<h2>أعمالي</h2>
<div class="grid" id="grid"></div>
</section>

<section>
<h2>البرامج والمهارات</h2>
<div class="tags" id="tags"></div>
</section>

<section id="contact" class="contact">
<h2>لنشتغل سوا</h2>
<p style="color:var(--muted);margin-bottom:18px">عندك مشروع؟ احكيلي عنه وبرجعلك بأسرع وقت.</p>
<div id="links"></div>
</section>
</div>
<footer id="foot"></footer>
